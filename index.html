<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта: Великая Отечественная война 1941-1945</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Наши стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ключевые битвы Великой Отечественной войны</h1>
            <p class="subtitle">1941-1945 гг.</p>
        </header>

        <div class="main-content">
            <!-- Карта -->
            <div id="map"></div>

            <!-- Боковая панель с информацией -->
            <aside class="info-panel" id="infoPanel">
                <button class="close-btn" id="closeBtn">&times;</button>
                <div class="info-content">
                    <h2 id="battleTitle">Выберите битву на карте</h2>
                    <div id="battleInfo">
                        <p>Нажмите на маркер на карте, чтобы узнать подробности о сражении.</p>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Легенда -->
        <div class="legend">
            <h3>Этапы войны</h3>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #ff4444;"></span>
                <span>Оборонительный этап (1941-1942)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #ffa500;"></span>
                <span>Коренной перелом (1942-1943)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #44ff44;"></span>
                <span>Наступательный этап (1943-1945)</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Наш скрипт -->
    <script src="js/script.js"></script>
</body>
</html>
